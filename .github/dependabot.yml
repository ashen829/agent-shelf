version: 2

# Weekly updates. Minor and patch updates are grouped into one PR per ecosystem;
# major updates get their own PR so they can be reviewed.
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      # Angular packages must move together; `ng update` migrations may be needed for majors.
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint", "typescript"]
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Angular supports exactly one TypeScript minor (Angular 22: >=6.0 <6.1), so minor and
      # major TypeScript updates fail `npm ci`. TypeScript moves with Angular via `ng update`.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
