version: 2

# Weekly updates. Minor and patch updates are grouped into one PR per ecosystem;
# major updates get their own PR so they can be reviewed.
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
