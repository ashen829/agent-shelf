spring:
  application:
    name: agentshelf
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
  session:
    timeout: 8h
    jdbc:
      table-name: identity.spring_session
      initialize-schema: never

  servlet:
    multipart:
      # CSV imports: at most 10 MB per file (validated again in the import service).
      max-file-size: 10MB
      max-request-size: 11MB

# Background jobs (ADR 0003).
db-scheduler:
  table-name: jobs.scheduled_tasks
  polling-strategy: lock_and_fetch
  # Run a newly scheduled job right away on this instance instead of waiting for the next poll.
  immediate-execution-enabled: true
  delay-startup-until-context-ready: true
  threads: 4

springdoc:
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**
  writer-with-order-by-keys: true

server:
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: AGENTSHELF_SESSION
        http-only: true
        same-site: lax
  error:
    include-stacktrace: never

logging:
  pattern:
    # Readable text logs (local, test): adds [requestId] to every line.
    correlation: "[%X{requestId:-}] "
  level:
    # Tomcat logs the full content of cookies it can't parse. Browsers send other apps' cookies
    # too, which can hold tokens or personal data, so keep this logger quiet.
    org.apache.tomcat.util.http.parser.Cookie: warn

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

---
# Local development: reads infra/.env, the same file Docker Compose uses.
spring:
  config:
    activate:
      on-profile: local
    import: optional:file:../infra/.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:agentshelf}
    username: ${POSTGRES_USER:agentshelf}
    password: ${POSTGRES_PASSWORD}

---
# Staging and production: every setting comes from the environment.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${AGENTSHELF_DB_URL}
    username: ${AGENTSHELF_DB_USER}
    password: ${AGENTSHELF_DB_PASSWORD}
server:
  servlet:
    session:
      cookie:
        secure: true
springdoc:
  api-docs:
    enabled: false
logging:
  structured:
    # JSON logs (Elastic Common Schema). MDC values such as requestId become fields.
    format:
      console: ecs
